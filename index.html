<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartographie des outils IT — chantier</title>
<style>
/* ============================================================
   CARTOGRAPHIE DES OUTILS IT — SYSTÈME DE DESIGN
   Format natif : 3 planches 16:9 (1600 × 900 px) → PowerPoint
   Source des données : BDD Cartographie Outils IT (16 entretiens)
   ============================================================ */

:root{
  --canvas:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB;
  --ink:#0D1526; --ink-2:#33415C; --muted:#78879F;
  --line:#E1E7F1; --line-2:#EDF1F7;

  --hub-bg:#0F1729; --hub-bg-2:#18233C;
  --hub-line:rgba(255,255,255,.14); --hub-chip:rgba(255,255,255,.06);
  --hub-ink:#FFFFFF; --hub-muted:#95A5C2;

  --met:#3A6BE5;  /* Méthodes & BIM          */
  --top:#0E9E78;  /* Topographie             */
  --tun:#0F8FA8;  /* Tunnel                  */
  --trv:#DD7E2C;  /* Travaux                 */
  --qse:#C2456A;  /* Qualité & Environnement */
  --dir:#5B57D6;  /* Direction               */
  --daf:#8257E6;  /* DAF                     */
  --ctr:#A9761A;  /* Contrat                 */
  --sec:#D93025;  /* Sécurité                */
  --core:#4CC9E8; /* socle / automatique     */

  --shadow:0 1px 2px rgba(13,21,38,.05), 0 12px 28px -14px rgba(13,21,38,.22);
  --shadow-hub:0 18px 44px -18px rgba(13,21,38,.55);
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Calibri,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#0A0F1B; --surface:#111A2B; --surface-2:#16223A;
    --ink:#F2F5FA; --ink-2:#C3CEE0; --muted:#8496B3;
    --line:#22304B; --line-2:#1C2740;
    --hub-bg:#060B16; --hub-bg-2:#101B31;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.8);
    --shadow-hub:0 18px 44px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --canvas:#0A0F1B; --surface:#111A2B; --surface-2:#16223A;
  --ink:#F2F5FA; --ink-2:#C3CEE0; --muted:#8496B3;
  --line:#22304B; --line-2:#1C2740; --hub-bg:#060B16; --hub-bg-2:#101B31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.8);
  --shadow-hub:0 18px 44px -18px rgba(0,0,0,.9);
}
:root[data-theme="light"]{
  --canvas:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB;
  --ink:#0D1526; --ink-2:#33415C; --muted:#78879F;
  --line:#E1E7F1; --line-2:#EDF1F7; --hub-bg:#0F1729; --hub-bg-2:#18233C;
  --shadow:0 1px 2px rgba(13,21,38,.05), 0 12px 28px -14px rgba(13,21,38,.22);
  --shadow-hub:0 18px 44px -18px rgba(13,21,38,.55);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);
     -webkit-font-smoothing:antialiased;padding:28px 0 56px}

.toolbar{max-width:1600px;margin:0 auto 18px;padding:0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .brandline{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;
     font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.16s ease}
.btn:hover{border-color:var(--muted);color:var(--ink);transform:translateY(-1px)}

/* ---------- planche 16:9 ---------- */
.deck{display:flex;flex-direction:column;align-items:center;gap:34px}
.stage{width:100%;max-width:1600px;padding:0 16px}
.slide{position:relative;width:1600px;height:900px;background:var(--surface);border:1px solid var(--line);
       border-radius:22px;box-shadow:var(--shadow);transform-origin:top left;overflow:hidden}
.slide-inner{position:absolute;inset:0;padding:42px 44px 34px}

/* ---------- bandeau de titre ---------- */
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:36px;height:84px}
.masthead h1{margin:0;font-size:40px;line-height:1.08;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.masthead .sub{margin:7px 0 0;font-size:14px;color:var(--muted);font-weight:500}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

.legend{display:flex;gap:26px;align-items:flex-start;padding-top:4px}
.legend .swatchrow{display:flex;flex-direction:column;gap:8px}
.legend .item{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.legend svg{flex:none}
.key{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;text-align:center;
     border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.key.k-int{background:color-mix(in srgb,var(--dir) 13%,transparent);border-color:color-mix(in srgb,var(--dir) 34%,transparent);color:var(--dir)}
.key.k-todo{border-style:dashed;color:var(--muted)}
.kdot{width:8px;height:8px;border-radius:50%;background:var(--core);flex:none;display:block}

/* ---------- plateau ---------- */
.board{position:absolute;left:44px;right:44px;top:140px;bottom:34px}
.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4}
.wire{fill:none;stroke-width:2;stroke-linecap:round;transition:opacity .2s ease,stroke-width .2s ease}
.wire.manuel{stroke-dasharray:6 5}
.port{transition:opacity .2s ease}

/* mise en page « une page » : pôles en haut, socle en bandeau, pôles en bas */
.board{display:flex;flex-direction:column;gap:14px}
.board{justify-content:space-between}
#board-x{gap:26px}
.prow{display:flex;gap:12px;flex:0 0 auto;z-index:2;min-height:0}
.prow .card{flex:1 1 0;min-width:0}
.hub-band{flex:0 0 auto;z-index:2;position:relative;
  background:linear-gradient(168deg,var(--hub-bg-2) 0%,var(--hub-bg) 68%);
  border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:var(--shadow-hub);
  padding:9px 14px 11px;display:flex;gap:10px;align-items:flex-start}
.hub-band .btitle{display:flex;flex-direction:column;justify-content:center;flex:0 0 108px;padding-right:4px}
.hub-band .btitle span{font-size:8.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--core)}
.hub-band .btitle b{font-size:14.5px;font-weight:800;color:var(--hub-ink);line-height:1.1;margin-top:3px}
.hub-band .hub-group{flex:1 1 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.hub-band .chips{display:flex;flex-direction:column;gap:4px}
.hub-band .hub-group.two .chips{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.hub-band .hub-group > span{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--hub-muted);text-align:center;line-height:1.15}
.hub-band .app{padding:5px 6px;font-size:11px;border-radius:7px;gap:5px}
.hub-band .core{background:rgba(76,201,232,.07);border:1px solid rgba(76,201,232,.25);border-radius:10px;
  padding:6px;display:flex;flex-direction:column;gap:4px;flex:1 1 0;min-width:0;align-self:stretch}
.hub-band .core-app{padding:5px 4px;border-radius:7px}
.hub-band .core-app b{font-size:11.5px}
.hub-band .core-app small{font-size:7.5px;margin-top:1px}

/* ---------- cartes service ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
      box-shadow:var(--shadow);padding:9px 11px 10px;display:flex;flex-direction:column;flex:0 1 auto;
      transition:box-shadow .2s ease,border-color .2s ease,opacity .2s ease}
.card-head{display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;align-self:center;
     box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 18%,transparent)}
.card h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.1}
.card .kicker{margin:1px 0 6px 17px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.missions{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;justify-content:space-evenly}
.card.wide .missions{display:grid;grid-template-columns:1fr 1fr;gap:7px 26px;align-content:space-evenly}
.card.wide .mission{min-width:0}
.tools{min-width:0}
.mission{display:flex;flex-direction:column;gap:4px}
.mlab{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
      color:var(--accent);display:flex;align-items:center;gap:7px;white-space:nowrap}
.mlab i{height:1px;flex:1;background:var(--line-2);display:block;min-width:8px}
.mission.todo .mlab{color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:4px}
.via{font-size:8.8px;font-weight:650;color:var(--muted);line-height:1.25;letter-spacing:.01em}
.via em{font-style:normal;color:color-mix(in srgb,var(--core) 65%,var(--ink-2));font-weight:750}

/* pastille outil : le fond porte la nature interne / externe */
.tool{display:inline-flex;align-items:center;gap:4px;font-size:10.8px;font-weight:700;line-height:1;
      padding:4px 8px;border-radius:999px;white-space:nowrap;text-align:center;
      background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.tool.int{background:color-mix(in srgb,var(--accent) 12%,transparent);
          border-color:color-mix(in srgb,var(--accent) 36%,transparent);color:var(--accent)}
.tool.todo{border-style:dashed;color:var(--muted);background:transparent}
.tool.socle{background:transparent;border-color:color-mix(in srgb,var(--core) 55%,transparent);
            color:color-mix(in srgb,var(--core) 62%,var(--ink-2))}
.tool i.auto{width:7px;height:7px;border-radius:50%;background:var(--core);flex:none;display:block}

/* ---------- socle commun ---------- */
.hub{position:absolute;left:516px;width:480px;top:0;bottom:0;z-index:2;
     background:linear-gradient(168deg,var(--hub-bg-2) 0%,var(--hub-bg) 62%);
     border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:var(--shadow-hub);
     padding:16px 18px 14px;display:flex;flex-direction:column;overflow:hidden}
.hub::after{content:"";position:absolute;left:50%;top:-150px;width:460px;height:290px;transform:translateX(-50%);
            background:radial-gradient(closest-side,rgba(76,201,232,.20),transparent 72%);pointer-events:none}
.hub-head{text-align:center;position:relative;z-index:1;padding-bottom:9px}
.hub-head .tag{font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--core)}
.hub-head h2{margin:6px 0 0;font-size:23px;font-weight:800;color:var(--hub-ink);letter-spacing:-.01em}
.hub-head p{margin:5px 0 0;font-size:11px;color:var(--hub-muted);font-weight:500}
.hub-body{display:flex;flex-direction:column;position:relative;z-index:1;flex:1;justify-content:space-between;padding:4px 0 10px}
.hub-group{display:flex;flex-direction:column;gap:6px}
.hub-group > span{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--hub-muted);text-align:center}
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.app{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--hub-chip);
     border:1px solid var(--hub-line);border-radius:9px;padding:8px 8px;text-align:center;
     font-size:12.5px;font-weight:750;color:var(--hub-ink);transition:.18s ease}
.app.int{background:rgba(76,201,232,.13);border-color:rgba(76,201,232,.42)}
.app i.auto{width:7px;height:7px;border-radius:50%;background:var(--core);flex:none;display:block}
.app.wide{grid-column:1 / -1}
.core{background:rgba(76,201,232,.07);border:1px solid rgba(76,201,232,.25);border-radius:12px;
      padding:10px;position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.core-app{background:rgba(255,255,255,.05);border:1px solid var(--hub-line);border-radius:9px;
          padding:9px 6px;text-align:center;color:var(--hub-ink)}
.core-app b{display:block;font-size:13.5px;font-weight:800}
.core-app small{display:block;margin-top:3px;font-size:9px;color:var(--hub-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* ---------- surbrillance ---------- */
.board.focusing .card:not(.is-active){opacity:.32}
.board.focusing .app:not(.is-active),.board.focusing .core-app:not(.is-active){opacity:.26}
.board.focusing .wire:not(.is-active),.board.focusing .port:not(.is-active){opacity:.08}
.board.focusing .wire.is-active{stroke-width:2.9}
.app.is-active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
.tool.is-active{outline:2px solid var(--accent);outline-offset:1px}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}

/* ---------- planches 2 et 3 ---------- */
.wrap{position:absolute;left:44px;right:44px;top:134px;bottom:34px;display:flex;gap:24px}
.mcol{flex:1 1 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
         color:var(--muted);padding:0 10px 9px;border-bottom:1.5px solid var(--line)}
tbody td{padding:5.5px 10px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line-2);line-height:1.2}
tbody tr:last-child td{border-bottom:none}
td.src,td.dst{font-weight:750;color:var(--ink)}
.tag-svc{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.05em;
         text-transform:uppercase;color:var(--accent);white-space:nowrap}
.tag-svc i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;display:block}
.arrow{display:inline-block;font-size:15px;font-weight:800;text-align:center;width:100%;color:var(--ink-2)}
.flux-mode{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;
           border-radius:999px;white-space:nowrap;text-align:center;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.flux-mode.auto{background:color-mix(in srgb,var(--core) 17%,transparent);border-color:color-mix(in srgb,var(--core) 45%,transparent);color:#0B7E99}

.aside{flex:0 0 372px;display:flex;flex-direction:column;gap:13px}
.aside .panel{flex:1 1 auto}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:15px 17px;display:flex;flex-direction:column}
.panel.dark{background:linear-gradient(168deg,var(--hub-bg-2),var(--hub-bg));border-color:rgba(255,255,255,.08);color:var(--hub-ink)}
.panel h3{margin:0 0 11px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel.dark h3{color:var(--core)}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;flex:1;justify-content:space-around}
.panel li{font-size:12.3px;line-height:1.42;color:var(--ink-2);display:flex;gap:9px}
.panel.dark li{color:#C9D5EA}
.panel li b{color:var(--ink);font-weight:800}
.panel.dark li b{color:#fff}
.idx{flex:none;width:19px;height:19px;border-radius:6px;background:var(--surface);border:1px solid var(--line);
     font-size:9.5px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-top:1px}
.panel.dark .idx{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:0 0 auto}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 10px 10px;text-align:center}
.stat b{display:block;font-size:29px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1}
.stat small{display:block;margin-top:5px;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.25}

/* barres de répartition */
.bars{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.bar-row .bar-lab{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.bar-row .bar-lab em{font-style:normal;color:var(--muted);font-weight:600}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar u{display:block;height:100%;text-decoration:none}

/* référentiel */
.ref{display:flex;gap:24px;flex:1;min-height:0}
.ref table{table-layout:fixed}
.ref tbody td{padding:1.5px 8px;font-size:10.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref table{height:auto}
.ref thead th{padding:0 8px 7px;font-size:9.5px}
.ref .nm{font-weight:750;color:var(--ink)}
.ref .nm.brief{color:color-mix(in srgb,var(--qse) 72%,var(--ink))}
.ref .ed{font-size:9.5px;color:var(--muted);font-weight:600;margin-left:10px}
.badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;padding:2.5px 7px;border-radius:999px;text-align:center;
       border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.badge.int{background:color-mix(in srgb,var(--dir) 13%,transparent);border-color:color-mix(in srgb,var(--dir) 34%,transparent);color:var(--dir)}
.badge.auto{background:color-mix(in srgb,var(--core) 17%,transparent);border-color:color-mix(in srgb,var(--core) 45%,transparent);color:#0B7E99}
.badge.todo{border-style:dashed}
.svcdots{display:flex;gap:3px;flex-wrap:wrap}
.svcdots i{width:7px;height:7px;border-radius:50%;display:block;flex:none}

.footnote{position:absolute;left:44px;right:44px;bottom:14px;font-size:10px;color:var(--muted);font-weight:600;
          display:flex;justify-content:space-between}

/* ---------- affiche service : chaîne de flux ---------- */
/* Une bande par mission, lue de gauche à droite : entrée de la donnée, étapes
   ordonnées, finalité. Les blocs prennent chacun la même part de la largeur
   restante, si bien que les colonnes « entrée » et « finalité » s'alignent d'une
   bande à l'autre — c'est ce qui rend l'affiche scannable verticalement. */
.affiche{position:absolute;left:44px;right:44px;top:140px;bottom:52px;
         display:flex;flex-direction:column;gap:12px;justify-content:space-evenly}
.pline{flex:1 1 0;max-height:210px;min-height:92px;position:relative;display:flex;align-items:stretch;
       background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.prail{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);display:block;
       border-radius:14px 0 0 14px}
.plabel{flex:0 0 194px;padding:12px 14px 12px 20px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.plabel b{display:block;font-size:12.5px;font-weight:800;line-height:1.18;color:var(--ink);letter-spacing:-.01em}
.plabel span{display:block;font-size:8px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
             color:var(--muted);line-height:1.3}
.pline.todo .plabel b{color:var(--ink-2)}
.pchain{flex:1 1 auto;display:flex;align-items:stretch;padding:11px 14px 11px 0;min-width:0}

.pstep,.pin,.pout{flex:1 1 0;min-width:0;border-radius:10px;padding:7px 6px;text-align:center;
                  display:flex;flex-direction:column;justify-content:center;gap:2px}
.pstep{background:var(--surface-2);border:1px solid var(--line)}
.pin{background:color-mix(in srgb,var(--accent) 8%,transparent);
     border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.pout{background:color-mix(in srgb,var(--accent) 15%,transparent);
      border:1px solid color-mix(in srgb,var(--accent) 46%,transparent)}
.parrow{flex:0 0 20px;display:flex;align-items:center;justify-content:center;
        font-size:13px;font-weight:800;color:var(--muted);line-height:1}

.pk{display:block;font-size:7px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);line-height:1.2}
.pin .pk,.pout .pk{color:var(--accent)}
.pact{display:block;font-size:8.8px;font-weight:650;color:var(--ink-2);line-height:1.3}
.pact b{font-weight:800;color:var(--ink)}
.ptool{display:block;font-size:11px;font-weight:800;color:var(--ink);line-height:1.2}
.pmeta{display:block;font-size:7.2px;font-weight:700;color:var(--muted);line-height:1.2;letter-spacing:.02em}
.pmeta.brief{color:color-mix(in srgb,var(--qse) 70%,var(--muted))}
.xbadge{display:block;margin-top:3px;font-size:6.8px;font-weight:800;letter-spacing:.03em;line-height:1.25;

        border:1px solid color-mix(in srgb,var(--xc) 44%,transparent);color:var(--xc)}

/* affiche « inventaire » — pôles dont le processus n'est pas recueilli */
.pline.inv .pin,.pline.inv .pout{flex:0 0 152px}
.pinv{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;
      padding:0 12px;min-width:0}
.pchip{border-radius:10px;background:var(--surface-2);border:1px solid var(--line);padding:6px 9px;
       text-align:center;display:flex;flex-direction:column;gap:2px;min-width:82px}
.pchip.int{background:color-mix(in srgb,var(--accent) 10%,transparent);
           border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.pchip.brief{border-style:dashed}

/* carte de pôle en mode « liste d'outils » — planche 1 */
.card .count{margin:0 0 7px 17px;font-size:8.5px;font-weight:800;letter-spacing:.1em;
             text-transform:uppercase;color:var(--accent)}
.card .toolwrap{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;flex:1 1 auto}
.tool.brief{border-style:dashed;background:transparent;
            color:color-mix(in srgb,var(--qse) 62%,var(--ink-2));
            border-color:color-mix(in srgb,var(--qse) 45%,transparent)}

/* planche « flux inter-services » : les missions deviennent les nœuds */
.xcard .missions{gap:5px;justify-content:flex-start}
.xmission{display:block;font-size:9.5px;font-weight:750;line-height:1.25;color:var(--ink-2);
          background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
          padding:5px 8px;text-align:center}
.xmission.hot{background:color-mix(in srgb,var(--accent) 12%,transparent);
              border-color:color-mix(in srgb,var(--accent) 38%,transparent);
              color:var(--accent);font-weight:800}

/* ---------- densité des tableaux d'annexe ---------- */
.secttitle{margin:0 0 4px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
           color:var(--ink-2)}
.secttitle em{font-style:normal;font-size:9.5px;letter-spacing:.04em;text-transform:none;
              color:var(--muted);font-weight:650}
.mcol .secttitle + table + .secttitle{margin-top:7px}
.wrap .mcol table tbody td{padding:1.1px 8px;font-size:10.2px;white-space:nowrap;
                           overflow:hidden;text-overflow:ellipsis}
.wrap .mcol table thead th{padding:0 8px 4px;font-size:9.5px}
.wrap .mcol table td.obj{color:var(--muted);font-weight:600}
/* nom d'outil ou de mission : la casse d'origine, pas la capitale des libellés de pôle */
.wrap .mcol .tag-svc{font-size:10.2px;text-transform:none;letter-spacing:0;color:var(--ink)}
.wrap .mcol .arrow{font-size:13px}
.wrap .mcol .flux-mode{font-size:9px;padding:2px 7px}

/* note de bas d'affiche, au-dessus de la pagination */
.affnote{position:absolute;left:44px;right:44px;bottom:32px;font-size:9.5px;
         color:var(--muted);font-weight:600}

@page{size:423.33mm 238.13mm;margin:0}
@media print{
  body{background:#fff;padding:0}
  .toolbar{display:none}
  .deck{gap:0}
  .stage{padding:0;max-width:none}
  .slide{width:1600px;height:900px;transform:none!important;border:none;border-radius:0;box-shadow:none;
         break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
}

/* ============================================================
   1. OUTILLAGE COMMUN
   ------------------------------------------------------------
   Le deck compte 13 planches : la cartographie applicative, la planche des flux
   inter-services, une affiche par pôle, puis deux annexes tabulaires. Toutes sont
   générées ici, dans l'ordre où elles sont poussées dans le deck — c'est cet ordre
   que pptx/build.py reprend, une diapo par « .slide ».
   ============================================================ */
const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                   .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const SVC = Object.fromEntries(BDD.services.map(s => [s.id, s]));
const isAuto = d => d && (d.alim === "auto" || d.alim === "mixte");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* « s:Excel » ou « daf:Basware » → identifiant d'élément */
const idOf = (ref, bid) => {
  const i = ref.indexOf(":");
  const scope = ref.slice(0, i), name = ref.slice(i + 1);
  return scope === "s" ? `${bid}-s-${slug(name)}` : `${bid}-t-${scope}-${slug(name)}`;
};

/* Nature d'un outil, en une ligne : « manuel · externe », « auto · interne ».
   Un outil venu du brief et non de la BDD le dit, plutôt que d'afficher « ? ». */
function meta(name){
  const d = BDD.tools[name] || {};
  if (d.brief) return { txt: "hors BDD · brief", cls: "brief" };
  const al = d.alim === "?" ? "alim. TODO" : (isAuto(d) ? "auto" : "manuel");
  const ie = d.ie === "?" ? "int/ext TODO" : d.ie;
  return { txt: `${al} · ${ie}`, cls: "" };
}

const deck = document.querySelector(".deck");
const PLANCHES = [];

/* Une planche = un « .slide » de 1600 × 900 poussé dans le deck. Le numéro de
   planche est renseigné après coup : on ne connaît le total qu'à la fin. */
function addSlide(id, inner){
  const stage = document.createElement("div");
  stage.className = "stage";
  stage.innerHTML = `<div class="slide" id="${id}"><div class="slide-inner">${inner}
    <div class="footnote"><span>Source : BDD Cartographie Outils IT — 16 entretiens</span>
      <span data-page></span></div></div></div>`;
  deck.appendChild(stage);
  PLANCHES.push(id);
  return stage;
}

/* ============================================================
   2. PLANCHE 1 — CARTOGRAPHIE APPLICATIVE
   ------------------------------------------------------------
   Neuf pôles ne tiennent pas avec leurs missions détaillées : la carte liste les
   outils de chaque pôle, le détail des missions vit sur les affiches. Cinq pôles
   techniques en haut, socle en bandeau, quatre pôles support en bas.
   ============================================================ */
const BOARD = { id: "b1", top: BDD.board.top, bottom: BDD.board.bottom };

function toolChip(name, bid, svcId, seen){
  const d = BDD.tools[name] || {};
  const cls = d.brief ? "brief" : (d.todo ? "todo" : (d.ie === "interne" ? "int" : "ext"));
  const auto = isAuto(d) ? '<i class="auto"></i>' : "";
  const base = `${bid}-t-${svcId}-${slug(name)}`;
  const n = (seen[base] = (seen[base] || 0) + 1);
  return `<span class="tool ${cls}" id="${n === 1 ? base : base + "-" + n}">${auto}${esc(name)}</span>`;
}

function cardHTML(pid, bid){
  const s = SVC[pid], seen = {};
  return `<div class="card" id="${bid}-card-${pid}" data-svc="${pid}" data-board="${bid}" style="--accent:var(--${pid})">` +
    `<div class="card-head"><span class="dot"></span><h2>${esc(s.name)}</h2></div>` +
    `<p class="kicker">${esc(s.kicker)}</p>` +
    `<p class="count">${s.tools.length} outils</p>` +
    `<div class="toolwrap">${s.tools.map(t => toolChip(t, bid, pid, seen)).join("")}</div>` +
  `</div>`;
}

const CORE_SUB = { "SharePoint": "Référentiel", "Power BI": "Cabine de pilotage" };

function hubHTML(bid){
  const groups = BDD.socle.map(g => {
    const many = g.tools.length > 3;          /* groupe dense : deux colonnes de pastilles */
    return `<div class="hub-group${many ? " two" : ""}" style="flex-grow:${many ? 2 : 1}">` +
      `<span>${esc(g.group)}</span><div class="chips">` +
      g.tools.map(n => {
        const d = BDD.tools[n] || {};
        const auto = isAuto(d) ? '<i class="auto"></i>' : "";
        return `<div class="app ${d.ie === "interne" ? "int" : "ext"}" id="${bid}-s-${slug(n)}">${auto}${esc(n)}</div>`;
      }).join("") + `</div></div>`;
  }).join("");
  const core = BDD.core.map(n =>
    `<div class="core-app" id="${bid}-s-${slug(n)}"><b>${esc(n)}</b><small>${CORE_SUB[n] || ""}</small></div>`).join("");
  return `<div class="hub-band">
      <div class="btitle"><span>Socle applicatif</span><b>Logiciels communs</b></div>
      ${groups}<div class="core">${core}</div>
    </div>`;
}

/* ============================================================
   3. AFFICHES SERVICE
   ------------------------------------------------------------
   Deux rendus, selon ce que la BDD et le brief permettent de dire :
     · « chaîne »     — entrée de la donnée, étapes ordonnées, finalité. Les blocs
                        se partagent la largeur restante, si bien que les colonnes
                        entrée et finalité s'alignent d'une bande à l'autre.
     · « inventaire » — les outils de la mission entre deux blocs à documenter,
                        pour les pôles dont le processus n'a pas été recueilli.
   Les interconnexions sont posées en badge sur le bloc concerné ; les fils tracés
   sont réservés à la planche inter-services, où ils ne traversent aucune carte.
   ============================================================ */
const ARROW = '<span class="parrow">▸</span>';

/* Badge d'interconnexion : « → DAF · contrôle budgétaire ». Le sens suit l'ancre —
   « out » sort du pôle, « in » vient de l'autre pôle. */
function badge(link){
  const t = SVC[link.to];
  if (!t) return "";
  const dir = link.at === "in" ? "←" : "→";
  /* deux lignes : « → DAF » puis la mission. Sur une seule, le libellé le plus
     long débordait du bloc à l'export — Calibri est plus large que le mesuré. */
  return `<span class="xbadge" style="--xc:var(--${link.to})">${dir} ${esc(t.name)}<br>${esc(link.mission)}</span>`;
}
const badgesAt = (m, at) => (m.links || []).filter(l => l.at === at).map(badge).join("");

function blockTool(name){
  if (!name) return "";
  const mt = meta(name);
  return `<span class="ptool">${esc(name)}</span><span class="pmeta ${mt.cls}">${mt.txt}</span>`;
}

function chainLine(pid, m){
  const inner = m.in.map(e => e.tool
      ? `<span class="pact">${esc(e.lab)} · <b>${esc(e.tool)}</b></span>`
      : `<span class="pact">${esc(e.lab)}</span>`).join("");
  const entree = `<div class="pin"><span class="pk">Entrée</span>${inner}${badgesAt(m, "in")}</div>`;

  const steps = m.steps.map((s, i) =>
    `<div class="pstep"><span class="pact">${esc(s.act)}</span>${blockTool(s.tool)}${badgesAt(m, i)}</div>`);

  const sortie = `<div class="pout"><span class="pk">Finalité</span>` +
    `<span class="pact">${esc(m.out.lab)}</span>${blockTool(m.out.tool)}${badgesAt(m, "out")}</div>`;

  return `<div class="pline${m.todo ? " todo" : ""}" style="--accent:var(--${pid})">
      <span class="prail"></span>
      <div class="plabel"><b>${esc(m.label)}</b>${m.note || m.todo
        ? `<span>${esc(m.note || "chaîne à valider")}</span>` : ""}</div>
      <div class="pchain">${[entree, ...steps, sortie].join(ARROW)}</div>
    </div>`;
}

function inventoryLine(pid, m, bid, seen){
  const chips = m.tools.map(n => {
    const d = BDD.tools[n] || {}, mt = meta(n);
    const base = `${bid}-t-${pid}-${slug(n)}`;
    const k = (seen[base] = (seen[base] || 0) + 1);
    return `<div class="pchip ${d.brief ? "brief" : (d.ie === "interne" ? "int" : "ext")}" ` +
      `id="${k === 1 ? base : base + "-" + k}">` +
      `<span class="ptool">${esc(n)}</span><span class="pmeta ${mt.cls}">${mt.txt}</span></div>`;
  }).join("");
  return `<div class="pline inv${m.todo ? " todo" : ""}" style="--accent:var(--${pid})">
      <span class="prail"></span>
      <div class="plabel"><b>${esc(m.label)}</b><span>${m.todo ? "mission proposée" : "ordre non attesté"}</span></div>
      <div class="pchain">
        <div class="pin"><span class="pk">Début</span><span class="pact">à documenter</span></div>
        ${ARROW}<div class="pinv">${chips}</div>${ARROW}
        <div class="pout"><span class="pk">Finalité</span><span class="pact">à documenter</span></div>
      </div>
    </div>`;
}

/* Ordre des affiches : celui du deck d'origine, pour que la relecture suive. */

const XB = { id: "x", top: XROWS.flat(), bottom: [], flows: BDD.xflows };

const xHot = new Set(BDD.xflows.flatMap(f => [f.from, f.to]));

/* ============================================================
   5. CONNECTEURS
   ------------------------------------------------------------
   Une seule courbe de Bézier cubique par flux : c'est le format qu'attend
   extract.js, et build.py n'émet qu'un cubicBezTo.
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
const css   = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const BOARDS = [BOARD, XB];

/* Flux à tracer sur une planche. La cartographie prend les flux applicatifs ;
   la planche inter-services porte les siens via b.flows. */
function boardFlows(b){
  const src = b.flows || BDD.flows;
  const poles = new Set([...(b.top || []), ...(b.bottom || [])]);
  return src.map((f, i) => ({ f, i })).filter(({ f }) => {
    if (f.map === false) return false;
    return [f.from, f.to].every(r => {
      const sc = r.slice(0, r.indexOf(":"));
      return sc === "s" || poles.has(sc);
    });
  });
}

function localRect(el, board, scale){
  const bb = board.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:(r.left-bb.left)/scale, y:(r.top-bb.top)/scale, w:r.width/scale, h:r.height/scale,
           cx:(r.left-bb.left+r.width/2)/scale, cy:(r.top-bb.top+r.height/2)/scale };
}

/* Un flux entre deux cartes sort du bord de la carte ; un flux interne à une
   carte (ou impliquant le socle) s'accroche à la pastille elle-même. */
function anchor(el, board, towardRight, scale, dy, useCard){
  const card = useCard ? el.closest(".card") : null;
  const box  = localRect(el, board, scale);
  const edge = card ? localRect(card, board, scale) : box;
  return { x: towardRight ? edge.x + edge.w : edge.x, y: box.cy + (dy || 0) };
}

function spread(items, b, board, scale){
  const el = ref => document.getElementById(idOf(ref, b.id));
  const cx = ref => { const e = el(ref); return e ? localRect(e, board, scale).cx : 0; };
  const cy = ref => { const e = el(ref); return e ? localRect(e, board, scale).cy : 0; };
  const offsets = {}, groups = {};
  items.forEach(({ f, i }) => {
    offsets[i] = { from: 0, to: 0 };
    const aFirst = cx(f.from) <= cx(f.to);
    [["from", f.from, aFirst ? "R" : "L", f.to], ["to", f.to, aFirst ? "L" : "R", f.from]]
      .forEach(([role, ref, side, other]) => {
        const k = idOf(ref, b.id) + "|" + side;
        (groups[k] = groups[k] || []).push({ i, role, oy: cy(other) });
      });
  });
  Object.values(groups).forEach(list => {
    if (list.length < 2) return;
    list.sort((a, b2) => a.oy - b2.oy);
    const step = 11, mid = (list.length - 1) / 2;
    list.forEach((it, k) => offsets[it.i][it.role] = (k - mid) * step);
  });
  return offsets;
}

function wireColor(f){
  const s = f.from.slice(0, f.from.indexOf(":")), t = f.to.slice(0, f.to.indexOf(":"));
  if (s === "s" && t === "s") return css("--core");        /* plomberie interne au socle */
  return css("--" + (s !== "s" ? s : t));                  /* couleur du pôle émetteur */
}

function drawBoard(b){
  const board = document.getElementById("board-" + b.id);
  if (!board) return;
  const svg = board.querySelector("svg.wires");
  const scale = board.getBoundingClientRect().width / board.offsetWidth || 1;
  svg.setAttribute("viewBox", `0 0 ${board.offsetWidth} ${board.offsetHeight}`);
  svg.innerHTML = "";

  const defs = document.createElementNS(SVGNS, "defs");
  const marks = new Set();
  const addMarker = color => {
    const key = `ah-${b.id}-` + color.replace(/[^a-z0-9]/gi, "");
    if (marks.has(key)) return key;
    marks.add(key);
    const m = document.createElementNS(SVGNS, "marker");
    m.setAttribute("id", key); m.setAttribute("viewBox", "0 0 10 10");
    m.setAttribute("refX", "9"); m.setAttribute("refY", "5");
    m.setAttribute("markerWidth", "7"); m.setAttribute("markerHeight", "7");
    m.setAttribute("orient", "auto-start-reverse"); m.setAttribute("markerUnits", "userSpaceOnUse");
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", "M0 0.6 L10 5 L0 9.4 L2.4 5 Z"); p.setAttribute("fill", color);
    m.appendChild(p); defs.appendChild(m);
    return key;
  };
  svg.appendChild(defs);

  const items = boardFlows(b);
  const off = spread(items, b, board, scale);

  items.forEach(({ f, i }) => {
    const a = document.getElementById(idOf(f.from, b.id));
    const c = document.getElementById(idOf(f.to, b.id));
    if (!a || !c) return;
    const color = wireColor(f);
    const ra = localRect(a, board, scale), rb = localRect(c, board, scale);
    const cardA = a.closest(".card"), cardB = c.closest(".card");
    const useCard = !(cardA && cardA === cardB);
    const aFirst = ra.cx <= rb.cx;
    let p0 = anchor(a, board,  aFirst, scale, off[i].from, useCard);
    let p1 = anchor(c, board, !aFirst, scale, off[i].to,   useCard);

    let d;
    const fan = el => {
      const host = el.closest(".missions");
      if (!host || !el.classList.contains("xmission")) return 0;
      const rows = [...host.children], k = rows.indexOf(el);
      return (k - (rows.length - 1) / 2) * 34;
    };
    const zone = el => el.closest(".hub-band") ? "band" : (el.closest(".prow") ? "row" : "");
    const rowOf = el => [...board.querySelectorAll(".prow")].indexOf(el.closest(".prow"));
    const acrossZones = (zone(a) && zone(c) && zone(a) !== zone(c)) ||
                        (useCard && rowOf(a) >= 0 && rowOf(a) !== rowOf(c));
    if (acrossZones || Math.abs(ra.cy - rb.cy) > Math.abs(ra.cx - rb.cx) * 1.2){
      /* Éléments empilés : on sort par le bord horizontal le plus proche de la cible. */
      const down = ra.cy <= rb.cy;
      const eA = useCard && cardA ? localRect(cardA, board, scale) : ra;
      const eB = useCard && cardB ? localRect(cardB, board, scale) : rb;
      p0 = { x: ra.cx + off[i].from + fan(a), y: down ? eA.y + eA.h : eA.y };
      p1 = { x: rb.cx + off[i].to   + fan(c), y: down ? eB.y : eB.y + eB.h };
      const dy = (p1.y - p0.y) * .5;
      d = `M ${p0.x} ${p0.y} C ${p0.x} ${p0.y + dy}, ${p1.x} ${p1.y - dy}, ${p1.x} ${p1.y}`;
    } else if (Math.abs(ra.cx - rb.cx) < 30){
      /* Pastilles alignées verticalement : on contourne par le couloir central
         du conteneur plutôt que de traverser les pastilles intermédiaires. */
      const host = a.closest(".hub") || a.closest(".card");
      const hc = host ? localRect(host, board, scale).cx : ra.cx;
      const sgn = ra.cx <= hc ? 1 : -1;
      p0.x = sgn > 0 ? ra.x + ra.w : ra.x; p0.y = ra.cy + off[i].from;
      p1.x = sgn > 0 ? rb.x + rb.w : rb.x; p1.y = rb.cy + off[i].to;
      const bow = 46 * sgn;
      d = `M ${p0.x} ${p0.y} C ${p0.x + bow} ${p0.y}, ${p1.x + bow} ${p1.y}, ${p1.x} ${p1.y}`;
    } else {
      const dx = Math.abs(p1.x - p0.x);
      if (dx < 26){                                       /* pastilles voisines : trait droit */
        d = `M ${p0.x} ${p0.y} C ${p0.x + (p1.x - p0.x) / 3} ${p0.y + (p1.y - p0.y) / 3}, ` +
            `${p0.x + (p1.x - p0.x) * 2 / 3} ${p0.y + (p1.y - p0.y) * 2 / 3}, ${p1.x} ${p1.y}`;
      } else {
        const k = (dx < 70 ? dx * .55 + 8 : Math.max(42, dx * .45)) * (aFirst ? 1 : -1);
        d = `M ${p0.x} ${p0.y} C ${p0.x + k} ${p0.y}, ${p1.x - k} ${p1.y}, ${p1.x} ${p1.y}`;
      }
    }

    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "wire " + (isAuto(f) ? "auto" : "manuel"));
    path.setAttribute("stroke", color);
    path.setAttribute("marker-end", `url(#${addMarker(color)})`);
    path.dataset.idx = i;
    svg.appendChild(path);

    const dot = document.createElementNS(SVGNS, "circle");
    dot.setAttribute("cx", p0.x); dot.setAttribute("cy", p0.y); dot.setAttribute("r", "3.2");
    dot.setAttribute("fill", css("--surface")); dot.setAttribute("stroke", color);
    dot.setAttribute("stroke-width", "2"); dot.setAttribute("class", "port");
    dot.dataset.idx = i;
    svg.appendChild(dot);
  });
}

const draw = () => BOARDS.forEach(drawBoard);

/* ============================================================
   6. SURBRILLANCE
   ============================================================ */
function clearFocus(board){
  board.classList.remove("focusing");
  board.querySelectorAll(".is-active").forEach(e => e.classList.remove("is-active"));
}
function focusIdx(board, b, indexes){
  clearFocus(board);
  if (!indexes.length) return;
  board.classList.add("focusing");
  const src = b.flows || BDD.flows;
  indexes.forEach(i => {
    const f = src[i];
    [idOf(f.from, b.id), idOf(f.to, b.id)].forEach(id => {
      const el = document.getElementById(id); if (!el) return;
      el.classList.add("is-active");
      const card = el.closest(".card"); if (card) card.classList.add("is-active");
    });
    board.querySelectorAll(`[data-idx="${i}"]`).forEach(e => e.classList.add("is-active"));
  });
}

BOARDS.forEach(b => {
  const board = document.getElementById("board-" + b.id);
  if (!board) return;
  const items = boardFlows(b);
  board.querySelectorAll(".card").forEach(card => {
    card.addEventListener("mouseenter", () => {
      const idx = items.filter(({ f }) =>
        f.from.startsWith(card.dataset.svc + ":") || f.to.startsWith(card.dataset.svc + ":"))
        .map(({ i }) => i);
      if (idx.length) focusIdx(board, b, idx);
      else { clearFocus(board); board.classList.add("focusing"); card.classList.add("is-active"); }
    });
    card.addEventListener("mouseleave", () => clearFocus(board));
  });
  board.querySelectorAll(".app, .core-app, .tool, .xmission").forEach(el => {
    el.addEventListener("mouseenter", () => focusIdx(board, b,
      items.filter(({ f }) => idOf(f.from, b.id) === el.id || idOf(f.to, b.id) === el.id)
           .map(({ i }) => i)));
    el.addEventListener("mouseleave", () => clearFocus(board));
  });
});

/* ============================================================
   7. ANNEXE 1 — MATRICE DES FLUX
   ------------------------------------------------------------
   Deux natures de flux, deux tableaux : les échanges d'outil à outil relevés en
   entretien, et les échanges de mission à mission décrits par le brief — ces
   derniers étant ceux que trace la planche inter-services.
   ============================================================ */
const ALL = Object.entries(BDD.tools);
const count = fn => ALL.filter(([, d]) => fn(d)).length;
const nSocle = count(d => d.socle);
const nInt = count(d => d.ie === "interne"), nExt = count(d => d.ie === "externe");
const nAuto = count(d => isAuto(d)), nMan = count(d => d.alim === "manuel");
const nBrief = count(d => d.brief);

/* « daf:Basware » → pastille de pôle + nom, sur une seule ligne : deux fragments
   empilés déborderaient à l'export (métriques Calibri ≠ DejaVu Sans). */
function endpoint(ref){
  const i = ref.indexOf(":"), scope = ref.slice(0, i), name = ref.slice(i + 1);
  const s = scope === "s" ? null : SVC[scope];
  const color = s ? `var(--${s.id})` : "var(--core)";
  return `<span class="tag-svc" style="--accent:${color}"><i></i>${esc(name)}</span>`;
}

const fluxRows = (list, xf) => list.map(f => {
  const auto = f.alim === "auto" || f.alim === "mixte";
  const mode = f.map === false ? "Indirect" : (auto ? "Automatique" : "Manuel");
  return `<tr><td>${endpoint(f.from)}</td>` +
         `<td><span class="arrow">${f.map === false ? "⇢" : "→"}</span></td>` +
         `<td>${endpoint(f.to)}</td>` +
         (xf ? "" : `<td><span class="flux-mode ${auto && f.map !== false ? "auto" : ""}">${mode}</span></td>`) +
         `<td class="obj">${esc(f.obj)}</td></tr>`;
}).join("");

addSlide("slide-flux",
  masthead("Annexe 1", "Matrice des flux de données",
           "Échanges relevés entre outils, et échanges entre missions décrits par le brief") +
  `<div class="wrap">
     <div class="mcol">
       <p class="secttitle">Flux applicatifs — d'outil à outil <em> · ${BDD.flows.length} relevés en entretien</em></p>
       <table>
         <colgroup><col style="width:24%"><col style="width:4%"><col style="width:24%"><col style="width:13%"><col style="width:35%"></colgroup>
         <thead><tr><th>Source</th><th></th><th>Destinataire</th><th>Alimentation</th><th>Objet du flux</th></tr></thead>
         <tbody>${fluxRows(BDD.flows, false)}</tbody>
       </table>
       <p class="secttitle">Échanges inter-services — de mission à mission <em> · ${BDD.xflows.length} issus du brief · ⇢ enchaînement interne à un pôle</em></p>
       <table>
         <colgroup><col style="width:26%"><col style="width:4%"><col style="width:26%"><col style="width:44%"></colgroup>
         <thead><tr><th>Mission émettrice</th><th></th><th>Mission destinataire</th><th>Objet de l'échange</th></tr></thead>
         <tbody>${fluxRows(BDD.xflows, true)}</tbody>
       </table>
     </div>
     <aside class="aside">
       <div class="stat-row" id="statRow"></div>
       <div class="panel"><h3>Répartition du parc</h3><div class="bars" id="bars"></div></div>
       <div class="panel dark"><h3>Points d'attention</h3><ul id="warnings"></ul></div>
     </aside>
   </div>`);

document.getElementById("statRow").innerHTML = [
  [BDD.services.length, "Pôles"], [ALL.length, "Outils recensés"],
  [BDD.flows.length + BDD.xflows.length, "Flux cartographiés"], [nBrief, "Outils hors BDD"]
].map(([v, l]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join("");

const N = ALL.length;
document.getElementById("bars").innerHTML = [
  { t:"Nature",       seg:[["Externes", nExt, "var(--muted)"], ["Internes", nInt, "var(--dir)"],
                           ["Non renseigné", N - nExt - nInt, "var(--line)"]] },
  { t:"Alimentation", seg:[["Manuel", nMan, "var(--muted)"], ["Automatique", nAuto, "var(--core)"],
                           ["Non renseigné", N - nMan - nAuto, "var(--line)"]] },
  { t:"Position",     seg:[["Applications métier", N - nSocle, "var(--muted)"], ["Socle commun", nSocle, "var(--met)"]] }
].map(r => {
  const seg = r.seg.filter(x => x[1] > 0);
  return `<div class="bar-row"><div class="bar-lab"><span>${r.t}</span>` +
    `<em>${seg.map(x => x[0] + " " + x[1]).join(" · ")}</em></div><div class="bar">` +
    seg.map(x => `<u style="width:${x[1] / N * 100}%;background:${x[2]}"></u>`).join("") +
    `</div></div>`;
}).join("");

const shared = ALL.filter(([, d]) => d.nb >= 3).sort((a, b) => b[1].nb - a[1].nb);
const nProc = BDD.services.filter(s => s.mode === "process").length;
document.getElementById("warnings").innerHTML = [
  `<b>${nMan} outils sur ${N}</b> sont alimentés manuellement : la ressaisie reste le principal point de fragilité du dispositif.`,
  `<b>${shared.length ? shared[0][0] : "Excel"}</b> est présent dans ${shared.length ? shared[0][1].nb : 0} pôles et concentre les échanges sans interface formalisée.`,
  `<b>${nProc} pôles sur ${BDD.services.length}</b> ont un processus recueilli ; les autres n'ont qu'un inventaire d'outils, sans ordre attesté.`,
  `<b>${nBrief} outils</b> viennent du brief métier et non de la base d'entretiens : leur nature et leur alimentation restent à confirmer.`
].map((t, i) => `<li><span class="idx">${"ABCD"[i]}</span><span>${t}</span></li>`).join("");

/* ============================================================
   8. ANNEXE 2 — RÉFÉRENTIEL DES OUTILS
   ============================================================ */
const refRows = ALL.slice().sort((a, b) => a[0].localeCompare(b[0], "fr"));
const half = Math.ceil(refRows.length / 2);
addSlide("slide-ref",
  masthead("Annexe 2", "Référentiel des outils",
           "Tous les outils recensés, avec éditeur, pôles servis, nature et alimentation",
           `<div class="legend"><div class="swatchrow">
              <span class="item"><span class="badge int">INT</span>Outil interne</span>
              <span class="item"><span class="badge auto">AUTO</span>Alimentation automatique</span>
              <span class="item"><span class="nm brief">Nom</span>Hors base d'entretiens</span>
            </div></div>`) +
  `<div class="wrap"><div class="ref">` +
  [refRows.slice(0, half), refRows.slice(half)].map(part =>
    `<div class="mcol"><table>
       <colgroup><col style="width:46%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup>
       <thead><tr><th>Outil</th><th>Pôles</th><th>Nature</th><th>Alimentation</th></tr></thead>
       <tbody>` + part.map(([n, d]) =>
         `<tr><td><span class="nm${d.brief ? " brief" : ""}">${esc(n)}</span>${d.ed ? `<span class="ed">${esc(d.ed)}</span>` : ""}</td>` +
         `<td><span class="svcdots">${d.svc.map(s => `<i style="background:var(--${s})" title="${SVC[s] ? esc(SVC[s].name) : s}"></i>`).join("")}</span></td>` +
         `<td><span class="badge ${d.brief ? "todo" : (d.ie === "interne" ? "int" : (d.ie === "?" ? "todo" : ""))}">` +
         `${d.ie === "interne" ? "Interne" : (d.ie === "?" ? "?" : "Externe")}</span></td>` +
         `<td><span class="badge ${isAuto(d) ? "auto" : (d.alim === "?" ? "todo" : "")}">` +
         `${isAuto(d) ? (d.alim === "mixte" ? "Mixte" : "Auto") : (d.alim === "?" ? "?" : "Manuel")}</span></td></tr>`
       ).join("") + `</tbody></table></div>`).join("") +
  `</div></div>`);

/* ============================================================
   9. NUMÉROTATION, MISE À L'ÉCHELLE, THÈME
   ============================================================ */
document.querySelectorAll(".slide [data-page]").forEach((el, i, all) => {
  el.textContent = `Planche ${i + 1} / ${all.length}`;
});

function fit(){
  document.querySelectorAll(".stage").forEach(stage => {
    const slide = stage.querySelector(".slide");
    const s = Math.min(1, (stage.clientWidth - 32) / 1600);
    slide.style.transform = `scale(${s})`;
    stage.style.height = (900 * s) + "px";
  });
  draw();
}
window.addEventListener("resize", fit);
window.addEventListener("load", fit);
fit();

document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  draw();
});
</script>
</body>
</html>
